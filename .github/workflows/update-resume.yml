name: Update and Deploy Resume

on:
  push:
    paths:
      - 'html/raw-resum-Aug162026.txt'
      - 'html/ArvindVerma_Resume.pdf'
      - 'python/resume_updater.py'
      - 'python/update-resume.py'
      - '.github/workflows/update-resume.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Extract text from PDF (if PDF changed or manual run)
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q 'ArvindVerma_Resume.pdf' || \
             [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Extracting text from PDF..."
            python - <<'EOF'
          import pdfplumber
          with pdfplumber.open('html/ArvindVerma_Resume.pdf') as pdf:
              text = '\n'.join(page.extract_text() or '' for page in pdf.pages)
          with open('html/raw-resum-Aug162026.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          print(f"Extracted {len(text)} chars from PDF")
          EOF
          else
            echo "PDF unchanged — using existing text file"
          fi

      - name: Generate HTML resume
        run: python python/update-resume.py

      - name: Commit updated files back to main
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add html/resume-pdf.html html/raw-resum-Aug162026.txt
          git diff --staged --quiet || git commit -m "chore: auto-update resume [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp html/resume-pdf.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4




