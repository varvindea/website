name: Update and Deploy Resume

on:
  push:
    paths:
      - 'html/raw-resum-Aug162026.txt'
      - 'html/ArvindVerma_Resume.pdf'
      - 'python/resume_updater.py'
      - 'python/update-resume.py'
      - '.github/workflows/update-resume.yml'
    branches:
      - arvind-verma-resume
      - main
      - master
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Extract text from PDF (if PDF changed)
        run: |
          # Detect if PDF was part of the push
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q 'ArvindVerma_Resume.pdf' || \
             [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "PDF changed or manual run — extracting text from PDF..."
            python - <<'EOF'
          import pdfplumber, os
          pdf_path = 'html/ArvindVerma_Resume.pdf'
          txt_path = 'html/raw-resum-Aug162026.txt'
          if os.path.exists(pdf_path):
              pages = []
              with pdfplumber.open(pdf_path) as pdf:
                  for page in pdf.pages:
                      pages.append(page.extract_text() or '')
              with open(txt_path, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(pages))
              print(f"Extracted {sum(len(p) for p in pages)} chars from PDF")
          else:
              print("PDF not found, skipping extraction")
          EOF
          else
            echo "PDF unchanged — using existing text file"
          fi

      - name: Generate HTML resume
        run: python python/update-resume.py

      - name: Commit generated files back to branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add html/resume-pdf.html html/raw-resum-Aug162026.txt
          git diff --staged --quiet || git commit -m "chore: auto-update resume HTML [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          publish_branch: gh-pages
          commit_message: "deploy: resume update from ${{ github.sha }}"

